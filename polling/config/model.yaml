# Modeling assumptions for a reusable statewide polling trend.
# This file is the default. The settings screen can override it.
# Overrides live in the database and can be reset to this file.
#
# The modeled quantity is the polling margin, in percentage points:
#   margin = share(margin.candidate_a) - share(margin.candidate_b)
# Positive means candidate_a is ahead. This is not a win probability.

race_key: tx-governor-2026

race:
  state: TX
  office: Governor
  cycle: 2026
  election_date: 2026-11-03
  # Nominees were treated as established after the late-May 2026 primaries.
  # Polls fielded before series_start are out of scope for this series.
  series_start: 2026-06-01

margin:
  candidate_a: Greg Abbott
  candidate_a_party: Republican
  candidate_b: Gina Hinojosa
  candidate_b_party: Democrat
  positive_means: "Abbott lead"
  even_band_pp: 0.5

# Other candidates are stored and shown. They are not reallocated into the margin
# unless experimental_reallocate_remainder is true (default false).
experimental_reallocate_remainder: false

precision:
  # Poll-level uncertainty floor, in percentage points, on the margin scale.
  # precision_weight = 1 / (SE_margin^2 + tau^2)
  tau_pp: 2.0
  # When a source prints both a simple MOE and a design-effect MOE, use the latter.
  prefer_design_effect_moe: true
  # Headline MOEs are treated as approximately 95% intervals.
  moe_z: 1.96
  # Inverting a MOE to an effective sample size assumes the published MOE is the
  # conventional p=0.5 figure unless the source says otherwise.
  moe_inversion_proportion: 0.5

sample_type:
  # multiplier: down-weight non-LV polls. model_based: estimate an additive
  # sample-type effect when enough LV and non-LV polls overlap, shrunk toward 0.
  mode: multiplier
  weights:
    LV: 1.00
    RV: 0.80
    Adults: 0.50
    Other: 0.70
  model_based:
    minimum_polls_per_type: 4
    shrinkage_k: 8

recency:
  half_life_days: 21
  # Age is measured from the field-date midpoint to the as-of date.
  adaptive:
    enabled: true
    # First matching band wins. min_days_out is "at least this many days before election day".
    bands:
      - { min_days_out: 61, half_life_days: 30 }
      - { min_days_out: 31, half_life_days: 21 }
      - { min_days_out: 0, half_life_days: 14 }

sponsorship_weights:
  # Assumptions about influence, not factual quality grades.
  nonpartisan_public: 1.00
  media: 1.00
  university: 1.00
  pac_advocacy: 0.85
  candidate_campaign: 0.70
  political_party: 0.70
  unknown: 0.85

clustering:
  # Polls from the same canonical pollster whose midpoints form a chain
  # with gaps of at most window_days are one cluster.
  window_days: 7
  # sqrt_dampen: each poll in a cluster of size k is multiplied by 1/sqrt(k).
  # cap: the cluster's total raw weight is capped at cap_multiple times its largest member.
  method: sqrt_dampen
  cap_multiple: 1.5

house_effects:
  apply: false
  minimum_polls: 3
  # estimate = raw_mean * n / (n + shrinkage_k). Larger k pulls harder toward 0.
  shrinkage_k: 8

trend:
  engine: weighted_local_linear
  bandwidth_days: 28
  bootstrap_draws: 400
  bootstrap_seed: 2026
  # Cluster bootstrap resamples polling organizations, not individual polls.

state_space:
  # Daily random-walk standard deviation of the latent margin, in percentage points.
  process_sd_per_day: 0.35
  initial_sd: 8.0
  # Engine B does not turn the state into a win probability.

outliers:
  # |residual| / sqrt(SE^2 + tau^2). Flag only. Do not auto-delete.
  standardized_threshold: 2.5

validation:
  percentage_sum_tolerance: 1.5
  moe_min: 0.4
  moe_max: 15
  date_slack_days: 1

subgroups:
  minimum_polls_for_trend: 3
  # Crosstabs are never inputs to the statewide topline.
  feed_into_topline: false

schedule:
  interval_hours: 3

display:
  candidate_a_color: "#9f1d2e"
  candidate_b_color: "#1d4f91"
  band_95: "rgba(15, 43, 82, 0.10)"
  band_80: "rgba(15, 43, 82, 0.18)"
